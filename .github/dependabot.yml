version: 2

updates:
  # Build, test and lint tooling. Routine development dependency bumps are
  # grouped into a single PR rather than arriving one per package.
  #
  # `applies-to: version-updates` keeps these groups off Dependabot's security
  # PRs — those stay ungrouped so a single fix can land on its own.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: thursday
      time: '06:00'
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
    ignore:
      # Svelte Check and typescript-eslint do not support TypeScript 7 yet.
      - dependency-name: typescript
        versions: ['>=7 <8']
      # Match the Node 22 runtime used by .nvmrc, CI and Netlify.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      dev-dependencies-major:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - major

  # Workflow actions. Dependabot advances the immutable commit pins while the
  # workflow comments retain the corresponding release version for readers.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: thursday
      time: '06:00'
      timezone: Europe/Stockholm
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
