<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A New Day is a daily checklist that resets at local midnight."
    />
    <meta name="theme-color" content="#F4F4F5" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable project information" />
    <title>A New Day</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload critical font to improve FCP -->
    <link rel="preload" href="/fonts/PublicSans-Variable.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <!-- Inline critical CSS for hero heading to eliminate render-blocking for LCP -->
    <style nonce="anewday">
      @font-face{font-family:'Public Sans';src:url('/fonts/PublicSans-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
      body{margin:0;padding:0;font-family:'Public Sans',-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background-color:#FEFEFE}
      @media (prefers-color-scheme:dark){body{background-color:#2C303A}}
      h1{margin:0;font-size:1.875rem;line-height:2.25rem;font-weight:600;letter-spacing:-0.04em;color:#2C303A}
      @media (prefers-color-scheme:dark){h1{color:#9CA3AF}}
    </style>
  </head>
  <body class="bg-brand-50 dark:bg-brand-900">
    <a href="#main" class="sr-only focus:not-sr-only">Skip to content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
