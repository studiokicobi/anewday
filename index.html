<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A New Day is a daily checklist that resets at local midnight."
    />
    <meta name="theme-color" content="#F4F4F5" />
    <title>A New Day</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload critical fonts to improve FCP -->
    <link rel="preload" href="/fonts/WorkSans-Regular.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <link rel="preload" href="/fonts/WorkSans-Medium.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <!-- Inline critical CSS for hero heading to eliminate render-blocking for LCP -->
    <style>
      body{margin:0;padding:0;font-family:'Work Sans',-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background-color:#f5f3f2}
      @media (prefers-color-scheme:dark){body{background-color:#1f1a18}}
      h1{margin:0;font-size:1.875rem;line-height:2.25rem;font-weight:500;letter-spacing:-0.04em;color:#18181B}
      @media (prefers-color-scheme:dark){h1{color:#c1b5b0}}
    </style>
  </head>
  <body class="bg-brand-50 dark:bg-brand-900">
    <a href="#main" class="sr-only focus:not-sr-only">Skip to content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
